<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACC · Agents Control Centre</title>
<link rel="icon" type="image/png" href="/favicon.png">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  { const t = localStorage.getItem("acc-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; }
</script>
<style>
  :root {
    --bg: #0f1115; --panel: #161920; --line: #262a33; --text: #e6e8ec; --dim: #8a909c; --sel: #1f3a55;
    --working: #e5c07b; --waiting: #c678dd; --idle: #98c379; --active: #61afef; --ended: #5c6370;
    --perm: #e06c75; --question: #c678dd; --input: #61afef; --accent: #61afef;
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  /* Theme: dark by default; light via the toggle (data-theme) or, in Auto,
     the OS preference. */
  :root { color-scheme: dark; }
  :root[data-theme="light"] {
    color-scheme: light; --bg: #f4f5f7; --panel: #fff; --line: #e1e4e8; --text: #1d2026; --dim: #6b7280; --sel: #dbeafe;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      color-scheme: light; --bg: #f4f5f7; --panel: #fff; --line: #e1e4e8; --text: #1d2026; --dim: #6b7280; --sel: #dbeafe;
    }
  }
  .meter { display: inline-block; width: 90px; height: 6px; border-radius: 3px; background: var(--line); vertical-align: middle; overflow: hidden; }
  .meter span { display: block; height: 100%; }
  #plan { display: inline-flex; gap: 6px; }
  button.tiny { padding: 1px 8px; font-size: 12px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  /* minmax(0, …) everywhere: grid/flex items default to min-height:auto, which
     lets a long transcript grow the page instead of scrolling inside #feed. */
  body { background: var(--bg); color: var(--text); display: grid; grid-template-rows: minmax(0, 1fr) auto; }
  .app { display: grid; grid-template-columns: minmax(280px, 26%) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 8px; padding: 8px; min-height: 0; }
  .side { display: grid; grid-template-rows: minmax(0, 1fr); gap: 8px; min-height: 0; }
  ul.list li.group { font-weight: 600; } ul.list li.group .gtools { visibility: hidden; } ul.list li.group:hover .gtools, ul.list li.group.sel .gtools { visibility: visible; }
  .detail { overflow: hidden; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; min-height: 0; }
  .panel > h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  .panel > h2 .r { margin-left: auto; text-transform: none; letter-spacing: 0; }
  .scroll { overflow: auto; min-height: 0; flex: 1; }
  ul.list { list-style: none; margin: 0; padding: 4px 0; }
  ul.list li { display: flex; align-items: center; gap: 6px; padding: 3px 10px; cursor: pointer; white-space: nowrap; }
  ul.list li:hover { background: color-mix(in srgb, var(--sel) 50%, transparent); }
  ul.list li.sel { background: var(--sel); }
  ul.list li.hit { outline: 1px solid var(--accent); outline-offset: -1px; }
  .search { padding: 6px 10px 2px; } .search input { width: 100%; box-sizing: border-box; }
  .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .dim { color: var(--dim); } .mono { font-family: ui-monospace, monospace; font-size: 12px; }
  .fold { width: 12px; color: var(--dim); text-align: center; flex: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--c, var(--dim)); }
  .dot.hollow { background: none; border: 1.5px solid var(--c, var(--dim)); }
  .bar { width: 3px; align-self: stretch; border-radius: 2px; background: var(--c, transparent); flex: none; }
  .s-working { --c: var(--working); } .s-waiting { --c: var(--waiting); } .s-idle { --c: var(--idle); }
  .s-active { --c: var(--active); } .s-ended { --c: var(--ended); } .s-running { --c: var(--working); } .s-done { --c: var(--idle); }
  .badge { font-weight: 700; font-size: 12px; }
  .a-permission { color: var(--perm); } .a-question { color: var(--question); } .a-input { color: var(--input); } .a-notice { color: var(--working); }
  .badge.lead { width: 12px; text-align: center; flex: none; }
  .ended .grow { color: var(--dim); }
  .needs .grow { font-weight: 700; }
  .sub { font-size: 12px; }
  input[type=text], select, textarea { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
  input[type=color] { width: 22px; height: 22px; border: 0; padding: 0; background: none; cursor: pointer; }
  button { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--dim); } button.on { border-color: var(--idle); color: var(--idle); }
  button.link { border: 0; background: none; color: var(--dim); padding: 0 3px; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 16px; width: min(520px, 92vw); }
  dialog::backdrop { background: rgb(0 0 0 / .35); }
  dialog#histdlg { width: min(900px, 94vw); }
  #hist { display: grid; gap: 10px; } #hist input[type=search] { width: 100%; box-sizing: border-box; }
  #histlist { height: min(42vh, 420px); overflow: auto; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  #histlist .h { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 12px; padding: 5px 6px; align-items: center; cursor: pointer; border-radius: 4px; }
  #histlist .h:hover { background: color-mix(in srgb, var(--line) 40%, transparent); }
  #histlist .h.sel { background: color-mix(in srgb, var(--active) 18%, transparent); }
  #histlist .h .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #histlist .h .m { color: var(--dim); font-size: 12px; white-space: nowrap; }
  #histlist .h .k { font-size: 10px; text-align: center; }
  #histinfo { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 12px; min-height: 9.5em; align-content: start; }
  #histinfo .ti { grid-column: 1 / -1; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
  #histinfo .k { color: var(--dim); } #histinfo .v { overflow-wrap: anywhere; }
  #histinfo .b { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 4px; }
  #launch { display: grid; gap: 10px; } #launch label { display: grid; gap: 4px; font-size: 12px; color: var(--dim); }
  #launch .actions { display: flex; gap: 8px; justify-content: flex-end; }
  form.row { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); }
  form.row input[type=text], form.row textarea { flex: 1; min-width: 0; }
  .detail { min-width: 0; }
  .head { padding: 10px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
  /* The open session's colour tints its info block, with a solid edge. */
  .head.tinted { background: color-mix(in srgb, var(--c) 14%, var(--panel)); border-left: 4px solid var(--c); padding-left: 10px; border-radius: 8px 8px 0 0; }
  .head .title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
  .head .title .r { margin-left: auto; font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--c); }
  .meta { color: var(--dim); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
  .goal .obj { color: var(--text); } .g-active { color: var(--working); } .g-met { color: var(--idle); }
  .g-failed { color: var(--perm); } .g-paused { color: var(--dim); }
  .meta b { color: var(--text); font-weight: 500; }
  .chip { display: inline-flex; gap: 4px; align-items: center; font-size: 11px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--c); color: var(--c); }
  .attn { margin: 0; padding: 8px 14px; border-bottom: 1px solid var(--line); font-weight: 600; }
  h2 .tiny { white-space: nowrap; }
  .tabs { display: flex; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--line); align-items: center; }
  .feed { padding: 10px 14px; font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
  .e { display: grid; grid-template-columns: 64px 36px 1fr; gap: 0 8px; padding: 2px 0; }
  .e .t { color: var(--dim); } .k-prompt .who { color: var(--accent); font-weight: 700; }
  .k-tool_use { color: var(--working); } .k-tool_result { color: var(--dim); } .k-tool_result.err { color: var(--perm); }
  .k-thinking { color: var(--dim); font-style: italic; }
  .latest h3 { font: 600 12px ui-sans-serif, system-ui; margin: 0 0 4px; }
  .latest .out { color: var(--dim); max-height: 50vh; overflow: auto; border-left: 2px solid var(--line); padding-left: 8px; }
  .msgs { border-top: 1px solid var(--line); padding: 6px 14px; max-height: 22vh; overflow: auto; font-size: 12px; }
  .msgs div { padding: 2px 0; } .ok { color: var(--idle); } .wait { color: var(--working); }
  .empty { color: var(--dim); padding: 40px; text-align: center; }
  footer { display: flex; gap: 16px; align-items: center; padding: 4px 12px; background: var(--panel); border-top: 1px solid var(--line); font-size: 12px; }
  footer .logo { font-weight: 800; background: var(--accent); color: #000; padding: 0 6px; border-radius: 3px; }
  footer .r { margin-left: auto; display: flex; gap: 12px; }
  #conn.live { color: var(--idle); } #conn.off { color: var(--perm); }
  #flash.err { color: var(--perm); } #flash.ok { color: var(--idle); }
  @media (max-width: 800px) { .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); } .side { max-height: 45vh; } }
</style>
</head>
<body>
<div class="app">
  <div class="side">
    <section class="panel">
      <h2><span id="sesstitle">Sessions</span>
        <button class="tiny" id="newsession" title="Start a new agent session in a terminal window (joins the selected group)">+ Session</button>
        <button class="tiny" id="history" title="Every session the agents have on record: resume one, or add it to ACC">History</button>
        <label class="r dim"><input type="checkbox" id="hideEnded"> hide ended</label></h2>
      <div class="search"><input type="search" id="q" placeholder="Jump to session…   /" autocomplete="off" spellcheck="false"
        title="Type part of a title, group, directory or id; ↑↓ choose, Enter opens, Esc clears"></div>
      <div class="scroll"><ul class="list" id="sessions"></ul></div>
      <form class="row" id="newgroup">
        <input type="text" name="path" placeholder="new group, e.g. team/api" required>
        <button>Add group</button>
      </form>
    </section>
  </div>
  <section class="panel detail" id="detail"></section>
</div>
<dialog id="launchdlg">
  <form id="launch">
    <b>New session</b>
    <label id="launchagent" hidden>Agent <select name="agent"></select></label>
    <label>Directory <input type="text" name="cwd" list="cwds" required placeholder="~/Projects/app"></label>
    <datalist id="cwds"></datalist>
    <label>Title <input type="text" name="title" placeholder="optional: ACC title and the agent's session name"></label>
    <label>Group <select name="group"></select></label>
    <label>First prompt <textarea name="prompt" rows="3" placeholder="optional"></textarea></label>
    <label>Host <select name="tmux"><option value="">config default</option><option value="true">tmux: survives closed windows</option><option value="false">plain window</option></select></label>
    <span class="dim" style="font-size:12px">Opens a terminal window on the machine running ACC.<span id="launchchannel"> Confirm the channel prompt there.</span></span>
    <div class="actions"><button type="button" id="launchcancel">Cancel</button><button>Start</button></div>
  </form>
</dialog>
<dialog id="histdlg">
  <div id="hist">
    <b>History <span class="dim" style="font-weight:400;font-size:12px">every session the agents have on record, newest first</span></b>
    <input type="search" id="hq" placeholder="Filter by title, directory or id… (↑↓ choose, Enter resumes or opens)" autocomplete="off" spellcheck="false">
    <div id="histlist"><div class="empty">loading…</div></div>
    <div id="histinfo"></div>
    <div class="actions" style="display:flex;gap:8px;align-items:center">
      <button type="button" id="forgetended" title="Remove all ended sessions from ACC (the agents keep them, so they stay in History)">Forget ended sessions</button>
      <span class="dim" style="font-size:12px;margin-right:auto">removes them from ACC only</span>
      <button type="button" id="histclose">Close</button></div>
  </div>
</dialog>
<footer>
  <span class="logo">ACC</span>
  <span id="conn">connecting…</span>
  <span id="flash"></span>
  <span class="r"><span id="plan"></span><span id="need" class="a-permission"></span><span id="counts"></span><span id="cost" class="dim"></span>
    <button id="costToggle" class="tiny" title="Show or hide cost (tokens stay visible)">$ shown</button>
    <button id="theme" class="tiny" title="Theme: Auto follows your OS">◐ Auto</button></span>
</footer>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BADGE = {permission: ["⚠", "needs permission"], question: ["?", "asked a question"], notice: ["!", "needs attention"], input: ["⏎", "awaiting input"]};
const needsYou = a => a === "permission" || a === "question" || a === "notice";
const PALETTE = ["#61afef", "#98c379", "#e5c07b", "#c678dd", "#e06c75", "#56b6c2", "#d19a66", "#abb2bf"];

const state = {
  sessions: [], groups: [], agents: [], ctxGroup: null, collapsed: new Set(), expanded: new Set(),
  open: null, // {session, agent}
  tracking: false, entries: [], offset: -1, latest: null, messages: [], hideEnded: false, q: "", qi: 0,
  showCost: localStorage.getItem("acc-cost") !== "off",
};

async function api(method, path, body) {
  const r = await fetch("/api/v1" + path, {
    method, headers: body ? {"Content-Type": "application/json"} : {},
    body: body ? JSON.stringify(body) : undefined, credentials: "same-origin",
  });
  if (r.status === 401) { location.replace("/"); throw new Error("signed out"); } // key rotated or cookie gone: back to sign-in
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.status === 204 ? null : r.json();
}
let flashT;
function flash(msg, err) {
  const f = $("#flash"); f.textContent = msg; f.className = err ? "err" : "ok";
  clearTimeout(flashT); flashT = setTimeout(() => f.textContent = "", 4000);
}
const ago = ms => { if (!ms) return "-"; const s = Math.max(0, (Date.now() - ms) / 1000);
  return s < 60 ? Math.floor(s) + "s" : s < 3600 ? Math.floor(s / 60) + "m" : s < 86400 ? Math.floor(s / 3600) + "h" : Math.floor(s / 86400) + "d"; };
const clock = ms => ms ? new Date(ms).toLocaleTimeString() : "-";
const pctColor = p => p >= 80 ? "var(--perm)" : p >= 50 ? "var(--working)" : "var(--idle)";
const resetLabel = ms => { const d = new Date(ms); return ms - Date.now() < 20 * 3600e3
  ? d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}) : d.toLocaleString([], {weekday: "short", hour: "2-digit", minute: "2-digit"}); };
const meter = p => `<span class="meter"><span style="width:${Math.min(100, p)}%;background:${pctColor(p)}"></span></span>`;
const money = v => v < 0.01 ? "$" + v.toFixed(4) : "$" + v.toFixed(2);
const tok = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n);
// The agents ACC supports (GET /agents): names and what ACC can do with each.
const agentOf = id => state.agents.find(a => a.id === id) || {id, name: id, short: id};
const displayColor = s => s.color || (s.groups.find(g => g.display_color) || {}).display_color || "";

// ---- groups --------------------------------------------------------------------
function subtree(id) {
  const out = new Set([id]); let grew = true;
  while (grew) { grew = false; for (const g of state.groups) if (out.has(g.parent_id) && !out.has(g.id)) { out.add(g.id); grew = true; } }
  return out;
}
function visible() {
  return state.sessions.filter(s => !(state.hideEnded && s.status === "ended")).sort((a, b) => b.started_at - a.started_at);
}

// ---- jump to session: sessions matching the search box, best first
// (title prefix, then title, then group, directory or id), live before ended.
function matches() {
  const q = state.q.trim().toLowerCase();
  if (!q) return [];
  const rank = s => {
    const t = (s.title || "").toLowerCase();
    if (t.startsWith(q)) return 0;
    if (t.includes(q)) return 1;
    if ([...s.groups.map(g => g.path), s.cwd || "", s.id].some(x => x.toLowerCase().includes(q))) return 2;
    return -1;
  };
  return state.sessions.map(s => [s, rank(s)]).filter(([, r]) => r >= 0)
    .sort((a, b) => a[1] - b[1] || (a[0].status === "ended") - (b[0].status === "ended") || b[0].last_seen - a[0].last_seen)
    .map(([s]) => s);
}
function jump(s) {
  state.q = ""; state.qi = 0; $("#q").value = ""; $("#q").blur();
  if (s.status === "ended" && state.hideEnded) { state.hideEnded = false; $("#hideEnded").checked = false; }
  const parent = new Map(state.groups.map(g => [g.id, g.parent_id]));
  for (const g of s.groups) for (let id = g.id; id; id = parent.get(id)) state.collapsed.delete(id);
  openSession(s.id);
  requestAnimationFrame(() => $("#sessions li.sel")?.scrollIntoView({block: "nearest"}));
}

// ---- the tree: groups, their subgroups and sessions, subagents; ungrouped at the root.
// A session in several groups shows under each.
function renderTree() {
  const list = visible(), open = state.open || {};
  const kids = new Map(), direct = new Map();
  for (const g of state.groups) { if (!kids.has(g.parent_id)) kids.set(g.parent_id, []); kids.get(g.parent_id).push(g); }
  for (const s of list) for (const g of s.groups) { if (!direct.has(g.id)) direct.set(g.id, []); direct.get(g.id).push(s); }
  const count = id => { const ids = subtree(id), seen = new Set(); for (const s of list) if (s.groups.some(g => ids.has(g.id))) seen.add(s.id); return seen.size; };
  const pad = d => `style="padding-left:${10 + d * 16}px"`;
  const sessionRow = (s, d, hit, note) => {
    const subs = s.subagents || [], running = subs.filter(a => a.status === "running").length;
    const b = BADGE[s.attention], needs = needsYou(s.attention);
    const sel = open.session === s.id && !open.agent;
    let row = `<li data-open="${esc(s.id)}" ${pad(d)} class="${sel ? "sel" : ""} ${hit ? "hit" : ""} ${s.status === "ended" ? "ended" : ""} ${needs ? "needs" : ""}">
      <span class="bar" style="--c:${esc(displayColor(s) || "transparent")}"></span>
      <span class="fold" data-expand="${esc(s.id)}">${subs.length ? (state.expanded.has(s.id) ? "▾" : "▸") : ""}</span>
      ${b ? `<span class="badge lead a-${s.attention}" title="${esc(b[1] + (s.attention_detail ? ": " + s.attention_detail : ""))}">${b[0]}</span>`
          : `<span class="dot s-${esc(s.status)}" title="${esc(s.status)}"></span>`}
      <span class="grow" title="${esc(s.cwd)}">${esc(s.title || s.id.slice(0, 8))}${note ? ` <span class="dim">${esc(note)}</span>` : ""}</span>
      ${s.context_pct >= 70 && s.status !== "ended" ? `<span style="color:${pctColor(s.context_pct)}" title="context window">ctx ${Math.round(s.context_pct)}%</span>` : ""}
      ${running ? `<span class="badge s-running" style="color:var(--c)" title="${running} subagent(s) running">⑂${running}</span>` : ""}
      ${s.pending_count ? `<span class="a-question" title="queued messages">✉${s.pending_count}</span>` : ""}
      ${state.showCost && s.usage && s.usage.cost_usd ? `<span class="dim">${money(s.usage.cost_usd)}</span>` : ""}
      <span class="dim">${ago(s.last_seen)}</span></li>`;
    if (state.expanded.has(s.id)) row += subs.map(a => `
      <li class="sub ${open.session === s.id && open.agent === a.id ? "sel" : ""}" ${pad(d + 1)} data-open="${esc(s.id)}" data-agent="${esc(a.id)}">
        <span class="dim">└</span><span class="dot s-${esc(a.status)}"></span>
        <span class="grow">${esc(a.type || "subagent")} <span class="dim">${esc(a.last_tool || "")}</span></span>
        <span class="dim">${ago(a.last_seen)}</span></li>`).join("");
    return row;
  };
  const groupRow = (g, d) => {
    const hasKids = (kids.get(g.id) || []).length || (direct.get(g.id) || []).length, closed = state.collapsed.has(g.id);
    let html = `<li class="group ${state.ctxGroup === g.id ? "sel" : ""}" data-group="${g.id}" ${pad(d)} title="${esc(g.path)}: click to fold, right-click to message">
      <span class="fold">${hasKids ? (closed ? "▸" : "▾") : ""}</span>
      <input type="color" value="${esc(g.display_color || "#888888")}" data-gcolor="${esc(g.path)}" title="${g.color ? "own colour" : "inherited, set to override"}">
      <span class="grow">${esc(g.name)}${g.color ? "" : ' <span class="dim">·inherit</span>'}</span>
      <span class="gtools">
        <button class="link" data-gsend="${esc(g.path)}" title="Message every live session in this group">✉</button>
        <button class="link" data-gchild="${esc(g.path)}" title="Add subgroup">＋</button>
        ${g.color ? `<button class="link" data-ginherit="${esc(g.path)}" title="Inherit parent colour">◌</button>` : ""}
        <button class="link" data-gdel="${esc(g.path)}" title="Delete with subgroups">✕</button></span>
      <span class="dim">${count(g.id)}</span></li>`;
    if (!closed) {
      for (const c of kids.get(g.id) || []) html += groupRow(c, d + 1);
      for (const s of direct.get(g.id) || []) html += sessionRow(s, d + 1);
    }
    return html;
  };
  $("#sesstitle").textContent = `Sessions (${list.length})`;
  if (state.q.trim()) {
    const m = matches();

async function loadDetail() {

      if (state.open === o && state.tracking) {

  if (!p) { info.innerHTML = ""; return; }
  const s = state.sessions.find(x => x.id === p.id), act = histAction(p);
  const when = ms => ms ? `${new Date(ms).toLocaleString()} <span class="dim">(${ago(ms)} ago)</span>` : "-";
  const u = p.usage, usage = [u && `in ${tok(u.input_tokens || 0)} · out ${tok(u.output_tokens || 0)}${state.showCost && u.cost_usd ? " · " + money(u.cost_usd) : ""}`,
    p.size && `transcript ${p.size >= 1 << 20 ? (p.size / (1 << 20)).toFixed(1) + " MB" : p.size >= 1024 ? Math.round(p.size / 1024) + " KB" : p.size + " B"}`].filter(Boolean).join(" · ");
  const st = (p.running ? `<span class="ok">running</span> in a terminal · ` : "") + (s ? `in ACC, ${esc(s.status)}` : `<span class="dim">not in ACC</span>`);
  info.innerHTML = `<div class="ti">${esc(p.title || "(untitled)")}</div>
    <span class="k">directory</span><span class="v mono">${esc(p.cwd)}</span>
    <span class="k">agent · id</span><span class="v">${esc(p.agent)} · <span class="mono">${esc(p.id)}</span></span>
    <span class="k">started</span><span class="v">${when(p.started_at)}</span>
    <span class="k">last active</span><span class="v">${when(p.last_active)}</span>
    ${usage ? `<span class="k">${u ? "usage" : "size"}</span><span class="v">${usage}</span>` : ""}
    <span class="k">state</span><span class="v">${st}</span>
    ${p.transcript_path ? `<span class="k">transcript</span><span class="v mono dim">${esc(p.transcript_path)}</span>` : ""}
    <span class="b">${act === "resume" ? `<button class="tiny" data-hresume="${esc(p.id)}" title="Reopen it in a new terminal window, in its directory">↻ Resume</button>` : ""}
      ${s ? `<button class="tiny" data-hopen="${esc(p.id)}" title="Show it in ACC">Open in ACC</button>` : `<button class="tiny" data-hadd="${esc(p.id)}" title="List it in ACC without reopening it">+ Add to ACC</button>`}</span>`;
}
// histGo runs the selected session's main action.
function histGo() {
  const p = histRows()[state.hi]; if (!p) return;
  const act = histAction(p);
  $("#histinfo").querySelector(act === "resume" ? "[data-hresume]" : act === "add" ? "[data-hadd]" : "[data-hopen]")?.click();
}
document.addEventListener("change", async e => {
  const t = e.target;
  try {
    if (t.id === "hideEnded") { state.hideEnded = t.checked; return render(); }
    if (t.dataset.gcolor) { await api("POST", "/groups", {name: t.dataset.gcolor, color: t.value}); return refresh(); }
    if (t.id === "scolor") { await api("PATCH", "/sessions/" + encodeURIComponent(state.open.session), {color: t.value}); return refresh(); }
    if (t.id === "assign" && t.value) { await api("POST", "/assign", {session_id: state.open.session, group: t.value}); return refresh(); }
  } catch (err) { flash(err.message, true); }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  try {
    if (f.id === "newgroup") {
      const path = f.path.value.trim().replace(/^\/+|\/+$/g, "");
      // Top-level groups get a palette colour; subgroups inherit until overridden.
      await api("POST", "/groups", {name: path, color: path.includes("/") ? "" : PALETTE[state.groups.length % PALETTE.length]});
      f.reset(); flash("group saved"); return refresh();
    }
    if (f.id === "launch") {
      const req = {agent: f.agent.value, cwd: f.cwd.value.trim(), title: f.title.value.trim(), group: f.group.value, prompt: f.prompt.value.trim()};
      if (f.tmux.value) req.tmux = f.tmux.value === "true";
      const r = await api("POST", "/sessions", req);
      $("#launchdlg").close(); flash(`started ${r.session_id.slice(0, 8)} in ${r.terminal}` + (req.agent === "claude-code" ? ": confirm the channel prompt in the new window" : ""));
      await refresh(); return openSession(r.session_id);
    }
    if (f.id === "composer") {
      const r = await api("POST", "/messages", {session_id: state.open.session, body: f.body.value});
      f.reset();
      if (r.typed?.length) flash("typed into the session's terminal");
      else flash(`sent: ${state.sessions.find(x => x.id === state.open.session)?.channel ? "delivering over the live channel" : "delivered when the session next acts"}`);
      return refresh();
    }
  } catch (err) { flash(err.message, true); }
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && !e.metaKey && !e.ctrlKey && !e.target.closest("input,textarea,select")) { e.preventDefault(); $("#q").focus(); return; }
  if (e.target.id === "hq" && state.past) {
    const page = e.key === "PageDown" || e.key === "PageUp" ? 10 : 1;
    if (["ArrowDown", "ArrowUp", "PageDown", "PageUp"].includes(e.key)) { e.preventDefault(); state.hi = (state.hi || 0) + (e.key === "ArrowDown" || e.key === "PageDown" ? page : -page); renderHistory(); }
    else if (e.key === "Enter") { e.preventDefault(); histGo(); }
    return;
  }
  if (e.target.id === "q") {
    const m = matches();
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (m.length) { state.qi = (state.qi + (e.key === "ArrowDown" ? 1 : -1) + m.length) % m.length; renderTree(); } }
    else if (e.key === "Enter") { e.preventDefault(); if (m[state.qi]) jump(m[state.qi]); }
    else if (e.key === "Escape") { state.q = ""; state.qi = 0; e.target.value = ""; e.target.blur(); renderTree(); }
    return;
  }
  // Shift+↑↓ or [ ]: previous / next session in the tree, wherever the focus is.
  const step = (e.shiftKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) ? (e.key === "ArrowUp" ? -1 : 1) : e.key === "[" ? -1 : e.key === "]" ? 1 : 0;
  if (step && !e.metaKey && !e.ctrlKey && !e.altKey && !e.target.closest("input,textarea,select,dialog")) { e.preventDefault(); return stepSession(step); }
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && e.target.closest("#composer")) e.target.form.requestSubmit();
  if (e.key === "Escape" && state.open && !e.target.closest("input,textarea")) { state.open = null; state.tracking = false; render(); }
});
document.addEventListener("scroll", e => { if (e.target.id === "feed") { const f = e.target; state.follow = f.scrollHeight - f.scrollTop - f.clientHeight < 30; } }, true);

// Group send: ✉ on a group row, or right-click it.
document.addEventListener("contextmenu", e => {
  const li = e.target.closest("[data-group]"); if (!li) return;
  e.preventDefault();
  messageGroup(state.groups.find(x => x.id === +li.dataset.group).path);
});
async function messageGroup(path) {
  const body = prompt(`Message every live session in ${path} (incl. subgroups):`);
  if (!body) return;
  const g = {path};
  try { const r = await api("POST", "/messages", {group: g.path, body}); flash(r.typed || r.skipped ? `typed into ${(r.typed || []).length} session(s), ${Object.keys(r.skipped || {}).length} skipped` : `queued for ${r.queued.length} session(s)`); refresh(); } catch (err) { flash(err.message, true); }
}

function stepSession(d) {
  const rows = [...document.querySelectorAll("#sessions [data-open]:not([data-agent])")];
  const ids = rows.map(r => r.dataset.open).filter((id, i, all) => all.indexOf(id) === i);
  const i = ids.indexOf(state.open?.session);
  const next = ids[i < 0 ? (d > 0 ? 0 : ids.length - 1) : i + d];
  if (!next) return flash(d > 0 ? "last session" : "first session");
  openSession(next);
  document.querySelector(`#sessions [data-open="${CSS.escape(next)}"]:not([data-agent])`)?.scrollIntoView({block: "nearest"});
}
function connect() {
  const es = new EventSource("/api/v1/stream");
  let t;
  es.addEventListener("hello", () => { $("#conn").textContent = "● live"; $("#conn").className = "live"; refresh(); });
  es.addEventListener("sessions", () => { clearTimeout(t); t = setTimeout(refresh, 150); });
  es.onerror = () => { $("#conn").textContent = "✗ reconnecting…"; $("#conn").className = "off"; };
}
// Theme toggle: Auto (OS) → Dark → Light.
const THEMES = [["auto", "◐ Auto"], ["dark", "● Dark"], ["light", "○ Light"]];
function applyTheme(t) {
  if (t === "auto") { delete document.documentElement.dataset.theme; localStorage.removeItem("acc-theme"); }
  else { document.documentElement.dataset.theme = t; localStorage.setItem("acc-theme", t); }
  $("#theme").textContent = THEMES.find(x => x[0] === t)[1];
}
applyTheme(localStorage.getItem("acc-theme") || "auto");
$("#costToggle").addEventListener("click", () => {
  state.showCost = !state.showCost;
  localStorage.setItem("acc-cost", state.showCost ? "on" : "off");
  render();
});
$("#theme").addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme || "auto";
  applyTheme(THEMES[(THEMES.findIndex(x => x[0] === cur) + 1) % THEMES.length][0]);
});

// Deep link: #s=<session>&a=<subagent>&t=1 opens a session (t=1: transcript).
function openFromHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("s")) { state.tracking = h.get("t") === "1"; openSession(h.get("s"), h.get("a")); }
}
addEventListener("hashchange", openFromHash);
openFromHash();
api("GET", "/agents").then(a => { state.agents = a; render(); }).catch(() => {});
connect();
</script>
</body>
</html>
