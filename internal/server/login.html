<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACC: sign in</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f9; --panel: #fff; --text: #1f2328; --dim: #6b7280; --line: #d8dde3; --accent: #61afef; --err: #d14343; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16181d; --panel: #1e2128; --text: #d7dae0; --dim: #8b93a1; --line: #2e333d; --err: #e06c75; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px ui-sans-serif, system-ui, sans-serif; }
  form { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px; width: min(380px, 90vw); display: grid; gap: 12px; }
  .logo { font-weight: 800; background: var(--accent); color: #000; padding: 0 6px; border-radius: 3px; justify-self: start; }
  input, button { font: inherit; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  button { cursor: pointer; } p { margin: 0; color: var(--dim); font-size: 12px; } .err { color: var(--err); display: none; }
</style>
</head>
<body>
<form method="post" action="/login">
  <span class="logo">ACC</span>
  <b>Sign in</b>
  <input type="password" name="key" placeholder="Key" autocomplete="current-password" autofocus required>
  <span class="err" id="err">That key didn't work.</span>
  <button>Sign in</button>
  <p>The key is in <code>~/.acc/remote_key</code> on the machine running ACC. On that machine, <code>acc open</code> signs you in.</p>
</form>
<script>if (location.search.includes("failed")) document.getElementById("err").style.display = "block";</script>
</body>
</html>
